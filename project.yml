name: CricketNets
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  CricketNets:
    type: application
    platform: iOS
    sources:
      - CricketNets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CricketNets
        # Bump MARKETING_VERSION per release, CURRENT_PROJECT_VERSION per build you install.
        # Both are shown on the Nets idle screen so you can confirm what's actually on the phone.
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Kept here rather than only in the generated .xcodeproj, which `xcodegen generate` rewrites.
        DEVELOPMENT_TEAM: 6W6R7FTLUS
        INFOPLIST_KEY_NSCameraUsageDescription: "Track the ball during net practice."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
  CricketNetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CricketNetsTests
    dependencies:
      - target: CricketNets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CricketNetsTests
        SWIFT_VERSION: "5.0"
schemes:
  CricketNets:
    build:
      targets:
        CricketNets: all
    test:
      targets:
        - CricketNetsTests
